name: Build & Release

# Triggers automatically when you push a version tag like: git tag v2.3.1 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone .exe (one-directory)
        run: python build_exe.py --clean

      - name: Zip the output folder
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist\NibCast\* -DestinationPath "NibCast-$version-windows.zip"
        shell: pwsh

      - name: Build single-file .exe
        run: python build_exe.py --onefile

      - name: Rename single-file exe
        run: |
          $version = "${{ github.ref_name }}"
          Copy-Item dist\NibCast.exe "NibCast-$version.exe"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NibCast ${{ github.ref_name }}"
          body: |
            ## What's New
            <!-- Fill in release notes here, or use the GitHub UI to edit after publishing -->

            ## Downloads

            | File | Description |
            |------|-------------|
            | `NibCast-${{ github.ref_name }}.exe` | **Single file** — just double-click. Slower first launch (~5s). |
            | `NibCast-${{ github.ref_name }}-windows.zip` | **Folder install** — extract and run `NibCast.exe`. Faster launch. |

            ## First Run
            1. Double-click `NibCast.exe`
            2. Windows will show a SmartScreen warning → click **More info → Run anyway**
            3. A setup wizard opens automatically — get a free Groq key at [console.groq.com](https://console.groq.com) and paste it in
            4. Press `Ctrl+Alt+V` and speak

            ## Requirements
            - Windows 10 / 11 (64-bit)
            - Microphone
            - Free [Groq API key](https://console.groq.com) (7,200 min/day free)

          draft: false
          prerelease: false
          files: |
            NibCast-${{ github.ref_name }}.exe
            NibCast-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
