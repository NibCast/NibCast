name: Build & Release

# Triggers automatically when you push a version tag like: git tag v2.3.1 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed to create the GitHub Release and upload assets

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone .exe (one-directory)
        run: python build_exe.py --clean

      - name: Zip the output folder
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist\NibCast\* -DestinationPath "NibCast-$version-windows.zip"
        shell: pwsh

      - name: Build single-file .exe
        run: python build_exe.py --onefile

      - name: Rename single-file exe
        run: |
          $version = "${{ github.ref_name }}"
          Copy-Item dist\NibCast.exe "NibCast-$version.exe"
        shell: pwsh

      # Release notes come from CHANGELOG.md — keep the version's section up to
      # date there and the release fills itself in (no post-publish editing).
      - name: Generate release notes from CHANGELOG.md
        run: python .github/gen_release_notes.py "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NibCast ${{ github.ref_name }}"
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            NibCast-${{ github.ref_name }}.exe
            NibCast-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
